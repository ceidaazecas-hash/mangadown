[project]
name = "mangadown"
version = "1.0.0"
description = "MangaDrop Manga Downloader & Converter for PDF, EPUB, and Kindle"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "h2>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "pypdf>=5.0.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
