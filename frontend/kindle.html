<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaDrop — Kindle Wi-Fi Hub</title>
  <style>
    /* High contrast, minimalist CSS specifically crafted for E-Ink Kindle screens */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: serif, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #000000;
      padding: 16px;
      line-height: 1.4;
    }
    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: #333333;
      margin-top: 4px;
    }
    .status-bar {
      border: 1px dashed #000000;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .refresh-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .book-list {
      list-style: none;
    }
    .book-card {
      border: 1px solid #000000;
      padding: 14px;
      margin-bottom: 12px;
      background: #ffffff;
    }
    .book-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .book-meta {
      font-size: 13px;
      color: #444444;
      margin-bottom: 10px;
    }
    .download-btn {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid #000000;
      text-align: center;
    }
    .download-btn:active {
      background: #ffffff;
      color: #000000;
    }
    .empty-state {
      padding: 30px 10px;
      text-align: center;
      border: 1px solid #999999;
      margin-top: 20px;
    }
    footer {
      margin-top: 30px;
      border-top: 1px solid #666666;
      padding-top: 12px;
      font-size: 11px;
      color: #555555;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 MangaDrop Kindle Hub</h1>
    <p class="subtitle">High-Speed Local Wi-Fi Manga Library for Kindle</p>
  </header>

  <div class="status-bar">
    <span>📡 Local Home Network: Active</span>
    <a href="/kindle" class="refresh-btn">🔄 Refresh</a>
  </div>

  <main>
    <ul class="book-list" id="bookList">
      <li class="empty-state">
        <p style="font-size: 16px; font-weight: bold;">Loading your manga library...</p>
      </li>
    </ul>
  </main>

  <footer>
    <p>Tap "Download to Kindle" to save any manga directly to your device storage.</p>
  </footer>

  <script>
    async function loadKindleLibrary() {
      const listContainer = document.getElementById("bookList");
      try {
        const res = await fetch("/api/history");
        if (!res.ok) throw new Error("Failed to load library");
        const items = await res.json();

        if (!items || items.length === 0) {
          listContainer.innerHTML = `
            <li class="empty-state">
              <p style="font-size: 16px; font-weight: bold; margin-bottom: 6px;">No Manga Downloaded Yet</p>
              <p style="font-size: 13px; color: #555;">Download a manga on your Mac at http://localhost:8000 first, then refresh this page on your Kindle!</p>
            </li>
          `;
          return;
        }

        listContainer.innerHTML = items.map(function(item) {
          return `
            <li class="book-card">
              <div class="book-title">${escapeHtml(item.manga_title || item.filename)}</div>
              <div class="book-meta">
                Format: <strong>${escapeHtml(item.format || 'EPUB')}</strong> | 
                Size: <strong>${item.file_size || 'Ready'}</strong> | 
                Range: ${escapeHtml(item.chapter_range || 'All')}
              </div>
              <a href="${item.download_url}" download="${escapeHtml(item.filename)}" class="download-btn">
                ⬇️ Download to Kindle (${item.file_size || 'Download'})
              </a>
            </li>
          `;
        }).join("");

      } catch (err) {
        listContainer.innerHTML = `
          <li class="empty-state">
            <p style="font-size: 15px; font-weight: bold; color: red;">Could not connect to Mac library</p>
            <p style="font-size: 12px; margin-top: 4px;">Make sure your Kindle and Mac are on the same Wi-Fi network.</p>
          </li>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadKindleLibrary();
  </script>
</body>
</html>
